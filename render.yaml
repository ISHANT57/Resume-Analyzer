services:
  - type: web
    name: resume-ai-api
    env: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SESSION_SECRET
        generateValue: true

  - type: web
    name: resume-ai-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-spec run codegen && pnpm --filter @workspace/resume-analyzer run build
    staticPublishPath: ./artifacts/resume-analyzer/dist/public
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: BASE_PATH
        value: /
